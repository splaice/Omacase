# Omacase first-run seed for OmniWM v0.5.x.
#
# This is intentionally a partial config. OmniWM fills missing keys with its
# current defaults, canonicalizes the file, and owns the live copy at
# ~/.config/omniwm/settings.toml from then on. Omacase never symlinks or
# overwrites an existing live file.

[general]
defaultLayoutType = "niri"
ipcEnabled = true

[focus]
crossesMonitorAtEdge = true
moveCrossesMonitorAtEdge = true

[gaps]
size = 8.0

[gaps.outer]
left = 8.0
right = 8.0
top = 8.0
bottom = 8.0

[dwindle]
smartSplit = true
useGlobalGaps = true
moveToRootStable = true

[borders]
enabled = true
width = 4.0

[borders.color]
red = 0.5372549019607843
green = 0.7058823529411765
blue = 0.9803921568627451
alpha = 1.0

[workspaceBar]
enabled = true
showLabels = true
showFloatingWindows = true
systemStatsButton = true
deduplicateAppIcons = true
hideEmptyWorkspaces = false
reserveLayoutSpace = false
height = 24.0
backgroundOpacity = 0.1

[quakeTerminal]
enabled = true
position = "center"
widthPercent = 65.0
heightPercent = 65.0
animationDuration = 0.2
autoHide = false
opacity = 0.96
monitorMode = "focusedWindow"

